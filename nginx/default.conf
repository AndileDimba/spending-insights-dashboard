# Serves the single-page app (ADR 0012). TLS and HSTS belong to the ingress
# in front of this container.

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # File names carry a content hash, so they can be cached forever. A missing
    # asset is a 404, never index.html: serving HTML as a script would fail
    # with a confusing MIME error instead of a clear one.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Never serve source maps (threat T9) or dotfiles, even if one is copied in.
    location ~ (\.map$|/\.) {
        return 404;
    }

    # Always revalidated, so a new release is picked up on the next visit.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes such as /transactions fall back to the app.
    location / {
        try_files $uri /index.html;
    }
}
