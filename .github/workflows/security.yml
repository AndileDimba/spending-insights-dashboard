name: Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # New advisories are published against code that has not changed, so the
  # scans also run weekly (Mondays, 07:00 South African time).
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# No permissions by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Development dependencies are included: the build tooling is part of
      # the supply chain that produces the shipped files.
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
      - run: npm ci --ignore-scripts
      # Confirms every package came from the registry unmodified, and checks
      # provenance attestations where packages publish them.
      - name: Verify registry signatures
        run: npm audit signatures

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # 'actions' analyses the workflows themselves, for example for
        # script injection and over-broad permissions.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  image:
    name: Image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t spending-insights:scan .
      # trivy-action's tags were hijacked in March 2026 (CVE-2026-33634).
      # The SHA pin points at v0.36.0, released after the fix, and Trivy's
      # own version is set explicitly rather than taken from the action.
      # This job has no secrets, so even a compromised scanner could steal
      # nothing of value.
      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: spending-insights:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      # A second pass records every finding, at any severity, in the Security
      # tab, including on runs where the gate above failed.
      - name: Report all findings
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: spending-insights:scan
          format: sarif
          output: trivy-results.sarif
          skip-setup-trivy: true
      - name: Upload to the Security tab
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: container-image
